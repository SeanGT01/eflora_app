name: iOS Build Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build Flutter iOS (macOS M-series)
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Disable experimental Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit tests
        run: flutter test

      - name: Build Flutter bundle and generate iOS configuration
        run: |
          flutter build bundle
          cat << 'EOF' > ios/Flutter/Generated.xcconfig
          FLUTTER_ROOT=${FLUTTER_ROOT}
          FLUTTER_APPLICATION_PATH=${GITHUB_WORKSPACE}
          COCOAPODS_PARALLEL_CODE_SIGN=true
          FLUTTER_TARGET=lib/main.dart
          FLUTTER_BUILD_DIR=build
          FLUTTER_BUILD_NAME=1.0.27
          FLUTTER_BUILD_NUMBER=31
          EXCLUDED_ARCHS[sdk=iphonesimulator*]=i386
          EXCLUDED_ARCHS[sdk=iphoneos*]=armv7
          DART_OBFUSCATION=false
          TRACK_WIDGET_CREATION=true
          TREE_SHAKE_ICONS=false
          PACKAGE_CONFIG=.dart_tool/package_config.json
          EOF
          cat ios/Flutter/Generated.xcconfig

      - name: Compile iOS with Xcode (Device SDK, Unsigned)
        run: |
          cd ios
          pod install --repo-update
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            FLUTTER_ROOT="${FLUTTER_ROOT}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SYMROOT="${PWD}/build" \
            clean build
          cd ..

      - name: Package Unsigned IPA artifact
        run: |
          mkdir -p Payload
          APP_PATH=$(find ios/build -name "Runner.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build -name "Runner.app" -type d | head -n 1)
          fi
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "Runner.app" -type d | head -n 1)
          fi
          echo "Found app bundle at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r E-FLORA-iOS-App.ipa Payload

      - name: Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: eflora-ios-app
          path: E-FLORA-iOS-App.ipa
          retention-days: 14
