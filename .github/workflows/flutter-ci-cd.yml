name: Flutter CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'android/**'
      - '.github/workflows/flutter-ci-cd.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'

jobs:
  analyze:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.10.x'
        channel: 'stable'
    
    - name: Install dependencies
      run: flutter pub get
    
    - name: Run code analysis
      run: flutter analyze
    
    - name: Run tests
      run: flutter test
      continue-on-error: true
    
    - name: Check code formatting
      run: dart format --output=none --set-exit-if-changed lib/
      continue-on-error: true

  build:
    needs: analyze
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.10.x'
        channel: 'stable'
    
    - name: Install dependencies
      run: flutter pub get
    
    - name: Build APK
      run: flutter build apk --release
      continue-on-error: true
    
    - name: Build App Bundle (Android)
      run: flutter build appbundle --release
      continue-on-error: true
    
    - name: Upload APK as artifact
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: flutter-apk
        path: build/app/outputs/flutter-app-release.apk
        retention-days: 30
      continue-on-error: true
    
    - name: Build IPA (iOS)
      run: flutter build ios --release --no-codesign
      continue-on-error: true

  notify:
    needs: [ analyze, build ]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Check Build Status
      run: |
        if [ "${{ needs.build.result }}" == "success" ]; then
          echo "✅ Flutter build successful!"
        else
          echo "⚠️ Flutter build completed with warnings. Check logs above."
        fi
    
    - name: Comment on PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '✅ Flutter CI/CD pipeline completed. Check the artifacts for APK builds.'
          })
      continue-on-error: true
