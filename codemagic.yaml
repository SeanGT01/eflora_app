workflows:
  ios-simulator-workflow:
    name: E-FLORA iOS App Preview (In-Browser Simulator)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Disable experimental SPM
        script: flutter config --no-enable-swift-package-manager
      - name: Disable analytics
        script: flutter config --no-analytics
      - name: Get dependencies
        script: flutter pub get
      - name: Build iOS Simulator for App Preview
        script: flutter build ios --simulator
    artifacts:
      - build/ios/iphonesimulator/Runner.app

  multiplatform-workflow:
    name: E-FLORA Multiplatform CI/CD (Android + iOS)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Disable experimental SPM
        script: flutter config --no-enable-swift-package-manager
      - name: Disable analytics
        script: flutter config --no-analytics
      - name: Get dependencies
        script: flutter pub get
      - name: Run unit smoke tests
        script: flutter test
      - name: Build Android APK
        script: flutter build apk --release
      - name: Build iOS Simulator for App Preview
        script: flutter build ios --simulator
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/ios/iphonesimulator/Runner.app

  android-release-workflow:
    name: E-FLORA Android Dedicated Build
    max_build_duration: 20
    instance_type: linux_x2
    environment:
      flutter: stable
    scripts:
      - name: Get dependencies
        script: flutter pub get
      - name: Build Android APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
