workflows:
  multiplatform-workflow:
    name: E-FLORA Multiplatform CI/CD (Android + iOS)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Flutter doctor
        script: flutter doctor -v
      - name: Get dependencies
        script: flutter pub get
      - name: Run unit smoke tests
        script: flutter test
      - name: Build Android APK
        script: flutter build apk --release
      - name: Install CocoaPods
        script: |
          cd ios
          pod install
      - name: Build iOS (Release without code signing)
        script: |
          flutter build ios --release --no-codesign
      - name: Package Unsigned IPA artifact
        script: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r build/ios/iphoneos/E-FLORA-unsigned.ipa Payload
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/ios/iphoneos/*.ipa
      - build/ios/iphoneos/Runner.app

  ios-release-workflow:
    name: E-FLORA iOS Dedicated Build
    max_build_duration: 25
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get dependencies
        script: flutter pub get
      - name: Install CocoaPods
        script: |
          cd ios
          pod install
      - name: Build iOS (Release without code signing)
        script: |
          flutter build ios --release --no-codesign
      - name: Package Unsigned IPA artifact
        script: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r build/ios/iphoneos/E-FLORA-unsigned.ipa Payload
    artifacts:
      - build/ios/iphoneos/*.ipa
      - build/ios/iphoneos/Runner.app

  android-release-workflow:
    name: E-FLORA Android Dedicated Build
    max_build_duration: 20
    instance_type: linux_x2
    environment:
      flutter: stable
    scripts:
      - name: Get dependencies
        script: flutter pub get
      - name: Build Android APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
